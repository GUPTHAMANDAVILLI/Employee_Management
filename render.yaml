services:
  - type: web
    name: emp-management-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: emp-management-db
          property: connectionString

databases:
  - name: emp-management-db
    plan: free
    region: oregon
    databaseName: emp_db
