<div class="modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">{{ employee ? 'Edit Employee' : 'Add Employee' }}</h3>
      <button class="close-btn" (click)="onClose()" aria-label="Close modal">✕</button>
    </div>

    <div class="alert-banner" *ngIf="errorMessage">
      <span>{{ errorMessage }}</span>
    </div>

    <form (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-grid">
        <!-- Employee ID (Add Mode) -->
        <div class="form-group full-width" *ngIf="!employee">
          <label for="empId">Employee ID <span class="optional-tag">(Optional / Custom ID)</span></label>
          <input 
            type="number" 
            id="empId" 
            [(ngModel)]="formData.id" 
            name="empId" 
            min="1" 
            placeholder="Leave blank for auto-generated ID"
            [class.invalid]="formErrors['id']"
          />
          <span class="error-text" *ngIf="formErrors['id']">{{ formErrors['id'] }}</span>
        </div>

        <!-- Employee ID (Edit Mode) -->
        <div class="form-group full-width" *ngIf="employee">
          <label for="empNewId">Employee ID <span class="optional-tag">(Current ID: #{{ employee.id }})</span></label>
          <input 
            type="number" 
            id="empNewId" 
            [(ngModel)]="formData.newId" 
            name="empNewId" 
            min="1" 
            placeholder="Enter new ID number to update"
            [class.invalid]="formErrors['id']"
          />
          <span class="error-text" *ngIf="formErrors['id']">{{ formErrors['id'] }}</span>
        </div>

        <!-- Name -->
        <div class="form-group full-width">
          <label for="name">Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="name" 
            [(ngModel)]="formData.name" 
            name="name" 
            placeholder="Full Name"
            [class.invalid]="formErrors['name']"
          />
          <span class="error-text" *ngIf="formErrors['name']">{{ formErrors['name'] }}</span>
        </div>

        <!-- Email -->
        <div class="form-group full-width">
          <label for="email">Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="formData.email" 
            name="email" 
            placeholder="email@example.com"
            [class.invalid]="formErrors['email']"
          />
          <span class="error-text" *ngIf="formErrors['email']">{{ formErrors['email'] }}</span>
        </div>

        <!-- Age -->
        <div class="form-group">
          <label for="age">Age <span class="required">*</span></label>
          <input 
            type="number" 
            id="age" 
            [(ngModel)]="formData.age" 
            name="age" 
            min="18" 
            max="100" 
            placeholder="Age"
            [class.invalid]="formErrors['age']"
          />
          <span class="error-text" *ngIf="formErrors['age']">{{ formErrors['age'] }}</span>
        </div>

        <!-- Gender -->
        <div class="form-group">
          <label for="gender">Gender <span class="required">*</span></label>
          <select 
            id="gender" 
            [(ngModel)]="formData.gender" 
            name="gender"
            [class.invalid]="formErrors['gender']"
          >
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
          <span class="error-text" *ngIf="formErrors['gender']">{{ formErrors['gender'] }}</span>
        </div>

        <!-- Department -->
        <div class="form-group">
          <label for="dept">Department <span class="required">*</span></label>
          <select 
            id="dept" 
            [(ngModel)]="formData.dept" 
            name="dept"
            [class.invalid]="formErrors['dept']"
          >
            <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
          </select>
          <span class="error-text" *ngIf="formErrors['dept']">{{ formErrors['dept'] }}</span>
        </div>

        <!-- Salary -->
        <div class="form-group">
          <label for="salary">Salary (₹) <span class="required">*</span></label>
          <input 
            type="number" 
            id="salary" 
            [(ngModel)]="formData.salary" 
            name="salary" 
            min="0" 
            step="1000" 
            placeholder="Annual Salary in Rupees"
            [class.invalid]="formErrors['salary']"
          />
          <span class="error-text" *ngIf="formErrors['salary']">{{ formErrors['salary'] }}</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="isSaving">
          <span *ngIf="!isSaving">{{ employee ? 'Update' : 'Save' }}</span>
          <span *ngIf="isSaving">Saving...</span>
        </button>
      </div>
    </form>
  </div>
</div>
